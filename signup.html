<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Sign Up</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   
    </head>
    <body>
        <main>
            <section id="signup-section">
                <h2>👋 Selamat Datang!</h2>
                <p>Buat akun untuk mulai menggunakan Business AI Dashboard.</p>
                <form id="signup-form">
                    <input type="text" id="new-username" placeholder="Username" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="new-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary login">Daftar</button>
                </form>
                <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
            </section>
        </main>

        <script>
            document.getElementById('signup-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('new-username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('new-password').value.trim();

                // Simpan data user baru (untuk demo, simpan di sessionStorage)
                const users = JSON.parse(sessionStorage.getItem('users') || '[]');
                users.push({ username, email, password });
                sessionStorage.setItem('users', JSON.stringify(users));

                alert('Akun berhasil dibuat! Silakan masuk. ✅');
                window.location.href = 'login.html';
            });
        </script>
    </body>
</html>
